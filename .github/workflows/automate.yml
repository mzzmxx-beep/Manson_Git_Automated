# ==============================================================================
# GitHub Actions Workflow — فن اللامبالاة - Automated Video Generation
# ==============================================================================
# Triggers:
#   - Scheduled: Once daily at 10:00 UTC (1:00 PM Riyadh time)
#     (offset from the Kafka project at 09:00 UTC to avoid overlap)
#   - Manual:    Via "workflow_dispatch" from the Actions tab
#
# Required GitHub Secrets:
#   - ANTHROPIC_API_KEY   : Anthropic Claude API key
#   - TELEGRAM_BOT_TOKEN  : Telegram Bot token from @BotFather
#   - TELEGRAM_CHAT_ID    : Target Telegram chat / channel ID
#
# book_state.json tracks lesson progress. It is committed back to the repo
# after each successful run so tomorrow's episode covers the next lesson.
# ==============================================================================

name: 📖 فن اللامبالاة - Automated Video Pipeline

on:
  schedule:
    # Runs once a day at 10:00 UTC (1:00 PM Riyadh time)
    - cron: "0 10 * * *"

  # Allows manual execution from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write  # Needed to commit book_state.json back to the repo

jobs:
  generate-and-deliver-video:
    name: Generate & Deliver Motivational Video
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Prevent runaway jobs

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout the repository
      # -----------------------------------------------------------------------
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Python 3.9
      # -----------------------------------------------------------------------
      - name: 🐍 Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"  # Cache pip dependencies for faster runs

      # -----------------------------------------------------------------------
      # 3. Install system dependency: ffmpeg (required by MoviePy)
      # -----------------------------------------------------------------------
      - name: 🔧 Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version  # Verify installation

      # -----------------------------------------------------------------------
      # 4. Install Python dependencies
      # -----------------------------------------------------------------------
      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------------------------------------------------
      # 5. Run the pipeline
      # -----------------------------------------------------------------------
      - name: 🚀 Run Motivational Video Generation Pipeline
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      # -----------------------------------------------------------------------
      # 6. Commit updated book state so tomorrow's episode covers the next lesson
      # -----------------------------------------------------------------------
      - name: 📝 Commit Book State
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add book_state.json
          git diff --cached --quiet || git commit -m "chore: update book state [skip ci]"
          git push

      # -----------------------------------------------------------------------
      # 7. Upload artifacts on failure for debugging
      # -----------------------------------------------------------------------
      - name: 📤 Upload Debug Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-${{ github.run_number }}
          path: |
            *.log
            *.jpg
            *.mp3
          retention-days: 3
